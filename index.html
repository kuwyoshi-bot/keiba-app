<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Turf Note</title>
  <meta name="description" content="コースを選ぶと、馬券の買い・消し条件と血統・枠の傾向がわかる自分用ノート">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turf Note">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <button id="topback" class="topback" data-back aria-label="前の画面に戻る"><b>‹</b>戻る</button>
        <img class="brand-mark" src="icon-180.png" alt="" aria-hidden="true">
        <div>
          <div class="brand-name">Turf Note</div>        </div>
        <button id="skin" class="skin-btn" aria-label="デザインを切り替える"><i></i><span>Midnight</span></button>
      </div>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="メニュー">
      <button class="tab is-active" data-tab="course"><i class="ti ti-course" aria-hidden="true"></i><span>コース</span></button>
      <button class="tab" data-tab="blood"><i class="ti ti-blood" aria-hidden="true"></i><span>血統</span></button>
    <button class="tab" data-tab="jockeys"><i class="ti ti-jockey" aria-hidden="true"></i><span>騎手</span></button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
